<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1026;color:#fff;font-family:Arial,sans-serif;text-align:center}
.rocket{font-size:80px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-20px) rotate(10deg)}}
h1{font-size:110px;margin:0;color:#ff5c8a;letter-spacing:8px}
p{font-size:20px;margin:10px 20px}
a{display:inline-block;margin-top:25px;color:#0b1026;background:#ffd166;padding:12px 26px;border-radius:30px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div>
<div class="rocket">&#128640;</div>
<h1>404</h1>
<p><strong>Ceci n'est pas une page</strong></p>
<p>This page drifted off into space. Let's get you back to Earth.</p>
<a href="/">Back to Earth</a>
</div>
</body>
</html>
